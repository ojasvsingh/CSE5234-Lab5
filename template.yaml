AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Adventure Beyond Labs 7-8 microservices connected to an existing MySQL database
Parameters:
  DatabaseHost:
    Type: String
    Description: RDS endpoint hostname (no protocol or port)
  DatabaseName:
    Type: String
    Default: adventure_beyond
  DatabaseUser:
    Type: String
    Description: Database application user
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 16
  ApplicationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group permitted to reach RDS on port 3306
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in the RDS VPC with NAT egress for the inventory API call
Globals:
  Function:
    Runtime: nodejs22.x
    CodeUri: services/
    MemorySize: 128
    Timeout: 10
    Environment:
      Variables:
        ALLOWED_ORIGIN: '*'
        DB_HOST: !Ref DatabaseHost
        DB_PORT: '3306'
        DB_NAME: !Ref DatabaseName
        DB_USER: !Ref DatabaseUser
        DB_PASSWORD: !Ref DatabasePassword
        DB_SSL: rds
    VpcConfig:
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroupId
      SubnetIds: !Ref PrivateSubnetIds
Resources:
  InventoryApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
  OrderApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: inventory/handler.handler
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      Events:
        ListInventory:
          Type: Api
          Properties:
            RestApiId: !Ref InventoryApi
            Path: /inventory-management/inventory
            Method: get
        SearchItems:
          Type: Api
          Properties:
            RestApiId: !Ref InventoryApi
            Path: /inventory-management/inventory/items
            Method: get
        ItemById:
          Type: Api
          Properties:
            RestApiId: !Ref InventoryApi
            Path: /inventory-management/inventory/items/{id}
            Method: get
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: orders/handler.handler
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          INVENTORY_SERVICE_URL: !Sub https://${InventoryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev
      Events:
        SubmitOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrderApi
            Path: /order-processing/order
            Method: post
Outputs:
  InventoryApiUrl:
    Description: Set VITE_INVENTORY_API_URL to this value
    Value: !Sub https://${InventoryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev
  OrderApiUrl:
    Description: Set VITE_ORDER_API_URL to this value
    Value: !Sub https://${OrderApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev
